<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Embedded video</title>
    <!--
        A neutral stand-in for an embedded video player, served by Focus in place of the real embed so
        documentation screenshots never load a third-party player.
    -->
    <style>
        html, body {
            height: 100%;
            margin: 0;
        }

        html {
            font-family: Helvetica, Arial, sans-serif;
            font-optical-sizing: none;
        }

        body {
            position: relative;
            overflow: hidden;
            color: #fafafa;
            background: radial-gradient(circle at 30% 20%, rgba(52, 211, 153, 0.30) 0%, transparent 55%), linear-gradient(135deg, #18181b 0%, #09090b 100%);
        }

        .play {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 18vmin;
            height: 18vmin;
            border-radius: 9999px;
            background: rgba(255, 255, 255, 0.14);
            box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.55);
            transform: translate(-50%, -50%);
        }

        .play::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 54%;
            border-style: solid;
            border-width: 4vmin 0 4vmin 6.5vmin;
            border-color: transparent transparent transparent #fafafa;
            transform: translate(-50%, -50%);
        }

        .caption {
            position: absolute;
            right: 4vmin;
            bottom: 4vmin;
            left: 4vmin;
        }

        .title {
            margin: 0;
            font-size: 5vmin;
            font-weight: 700;
        }

        .meta {
            margin: 1.5vmin 0 0;
            font-size: 3.2vmin;
            color: #a1a1aa;
        }

        .progress {
            height: 0.8vmin;
            margin-top: 3vmin;
            border-radius: 9999px;
            background: rgba(255, 255, 255, 0.2);
        }

        .progress::before {
            content: '';
            display: block;
            width: 0;
            height: 100%;
            border-radius: inherit;
            background: #fafafa;
        }
    </style>
</head>
<body>
    <div class="play" data-focus="poster"></div>
    <div class="caption">
        <p class="title">Embedded video</p>
        <p class="meta">Sample video &middot; 0:00 / 9:56</p>
        <div class="progress"></div>
    </div>
</body>
</html>
